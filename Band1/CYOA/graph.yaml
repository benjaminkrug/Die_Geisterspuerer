  101:
    title: "Sackgasse — Mama verbietet alles"
    file: "abschnitt_101.md"
    type: "dead_end"
    dead_end_id: "S1"
    zone: "B"
    summary: >
      Nora erzählt Mama alles. Die Wohnung oben, die Namensliste, das Klopfen, HILF.
      Sarah hört zu. Wird blass. Dann: "Ihr bleibt von dieser Wohnung weg. Beide.
      Sofort. Und der Hund kommt auch nicht mehr rein."
      Nora liegt im Bett. Schatten neben ihr. Das Klopfen beginnt wieder.
      Dreimal. Pause. Dreimal. Aber diesmal ist Nora allein damit.
      Manche Geheimnisse muss man selbst lösen.
    return_to: 16
    return_text: "Das hat nicht funktioniert. Geh zurück zu Abschnitt 16 und wähle anders."

  102:
    title: "Sackgasse — Allein in der Dunkelheit"
    file: "abschnitt_102.md"
    type: "dead_end"
    dead_end_id: "S2"
    zone: "D"
    summary: >
      Allein. Nachts. Ohne Theo. Ohne Plan. Nur Taschenlampe und Schatten.
      Der Keller verschluckt das Licht. Schatten bellt — panisch. Er hat noch nie so gebellt.
      Die Taschenlampe flackert. Geht aus.
      Dunkelheit. Völlige Dunkelheit.
      Dann: ein Flüstern. Direkt an Noras Ohr. Kinderstimme. Kalt.
      Nora rennt. Stolpert. Treppe hoch. Tür zu.
      Ohne Schatten. Ohne Theo. Ohne Plan. Das geht so nicht.
    return_to: 42
    return_text: "Das war keine gute Idee. Geh zurück zu Abschnitt 42 und entscheide dich anders."

  103:
    title: "Sackgasse — Lina will nicht ignoriert werden"
    file: "abschnitt_103.md"
    type: "dead_end"
    dead_end_id: "S3"
    zone: "E"
    summary: >
      Nora legt das Tagebuch hin. "Ich kann nicht mehr."
      Sofort: die Temperatur stürzt ab. Die Fenster frieren zu — von innen.
      Die Wände zittern. Ein tiefes Brummen, als ob das ganze Haus ächzt.
      Schatten jault. Hoch und durchdringend.
      Und auf jedem Fenster, jedem Spiegel, jeder glatten Oberfläche:
      "VERGISS NICHT VERGISS NICHT VERGISS NICHT"
      Lina will nicht ignoriert werden. Nicht nochmal. Nicht nach fünfzig Jahren.
      Du musst ihr zuhören.
    return_to: 58
    return_text: "Lina braucht dich. Geh zurück zu Abschnitt 58 und versuche es noch einmal."
