# ============================================================
# Die Geisterspuerer — Band 1 CYOA — Time Cave Struktur (v2)
# ============================================================
# Konventionen:
#   P  = Prolog (geteilt, alle Leser)
#   A  = Pfad A "Schatten folgen" (uebernatuerlich)
#   B  = Pfad B "Die Detektivin" (logisch)
#   C  = Pfad C "Mama erzaehlen" (Familie)
#   D  = Dead End (Sackgasse, zurueckblaettern)
#   E  = Ende (Abschluss mit Serien-Hook)
#
# Typen:
#   story     = Erzaehlabschnitt (kein Wahlpunkt)
#   choice    = Entscheidungspunkt (choices-Liste)
#   dead_end  = Sackgasse (Leser blaettert zurueck)
#   ending    = Buchende (Serien-Hook)
#
# Regeln:
#   - Pfade konvergieren NIE (ausser C2 -> A/B, einziger Konvergenzpunkt)
#   - Jede choice hat 2-3 Optionen
#   - Pro Durchgang: 30-40 Abschnitte, ~8.000-10.000 Woerter
# ============================================================

